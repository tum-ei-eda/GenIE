[tool.poetry]
name = "genie"
version = "0.1.0"
description = "TODO."
authors = ["Philipp van Kempen <philipp.van-kempen@tum.de>"]
readme = "README.md"
include = [{ path = "genie/patches/*.patch", format = ["sdist", "wheel"] }]
license = "Apache-2.0"
homepage = "https://github.com/tum-ei-eda/GenIE"
repository = "https://github.com/tum-ei-eda/GenIE"
documentation = "https://tum-ei-eda.github.io/GenIE/"


[tool.poetry.dependencies]
python = ">=3.10,<4"
click = ">=8,<8.2"
cloup = ">=3.0.5,<4"
pyyaml = ">=5,<7"
rich = ">=12,<14"
lxml = ">=4.9.0"
deprecated = ">=1.2.10,<2"
# The 0.3.1 sdist omits its Makefile; use the complete source on Python
# versions without published wheels (including the pinned Yosys submodule).
libparse = [
    { version = ">=0.3.1,<1", python = "<3.14" },
    { git = "https://github.com/efabless/libparse-python", rev = "cec8b6dfd3d1c97bc5ccd1d0a41c44e51bc9c1eb", python = ">=3.14" },
]
psutil = ">=5.9.0"
httpx = ">=0.22.0,<0.29"
yamlcore = "^0.0.2"
semver = "^3.0.2"
rapidfuzz = ">=3,<4"
# openlane = "~=2.3.10"
GitPython = "~=3.1.45"
docker = "~=7.1.0"
pandas = "~=2.3.3"
openlane = { git = "https://github.com/PhilippvK/openlane2", branch = "genie_wip" }
mlonmcu = { git = "https://github.com/tum-ei-eda/mlonmcu", rev = "ee84b85f2d7bf4dd898717cb12a80cb05dc45250", optional = true }
m2isar = { git = "https://github.com/tum-ei-eda/M2-ISA-R", rev = "59ba470011fafe5e814a2b9ca9504d8175fe25cc", optional = true }
isaac-toolkit = { git = "https://github.com/tum-ei-eda/isaac-toolkit", rev = "43fae872a999e9bbbe491e9f173ad7aca8c070a4", optional = true }


[tool.poetry.group.dev.dependencies]
wheel = "*"
black = ">=24.4.0,<25"

flake8 = ">=4"
flake8-no-implicit-concat = "0.3.3"
flake8-pytest-style = "*"

mypy = ">=1.9.0,<1.10.0"
lxml-stubs = "*"
types-urllib3 = "*"
types-typed-ast = "*"
types-six = "*"
types-setuptools = "*"
types-PyYAML = "*"
types-docutils = "*"
types-decorator = "*"
types-commonmark = "*"
types-colorama = "*"
types-Pygments = "*"
types-Deprecated = "*"
types-psutil = "*"

pytest = "*"
pytest-xdist = "*"
pytest-cov = "*"
pyfakefs = ">=5.2.3,<6"
pillow = ">=10.0.1,<11"

[tool.poetry.extras]
local = ["mlonmcu", "m2isar", "isaac-toolkit"]
# Setup.SetupSeal5 installs the pinned upstream source plus the bundled ISAAC patch.

[tool.poetry.scripts]
genie = "genie.__main__:cli"
"genie.steps" = "genie.steps.__main__:cli"
"genie.config" = "genie.config.__main__:cli"
"genie.state" = "genie.state.__main__:cli"
"genie.env_info" = "genie:env_info_cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
